<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Proyectos 2027 - Roadmap</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #142a3a; /* Fondo azul petróleo (Imagen 2) */
            --bg-container: #f4f6f8; /* Gris claro para contenedores (Imagen 2) */
            --text-dark: #1c2d42;
            --text-muted: #657786;
            --bar-color: #9ac1f0; /* Azul-grisáceo de las barras (Imagen 1) */
            --bar-hover: #7faee6;
            --accent-blue: #112331;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 24px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1500px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .top-navbar {
            background-color: var(--accent-blue);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-navbar h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .top-navbar .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-tablero {
            background: #ffffff;
            color: var(--bg-main);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-roadmap {
            background: #4a7fa3;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .roadmap-grid {
            display: grid;
            grid-template-columns: 200px 320px 180px repeat(4, 1fr);
            width: 100%;
            background-color: #ffffff;
        }

        .grid-header {
            background-color: #1a3245;
            color: #ffffff;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 13px;
            border-right: 1px solid #24435c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .grid-header.q-header {
            justify-content: center;
            text-align: center;
        }

        .grid-cell {
            padding: 14px 16px;
            border-bottom: 1px solid #e9edf2;
            border-right: 1px solid #e9edf2;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            font-size: 13px;
        }

        .grid-cell.classification {
            font-weight: 600;
            color: #4a7fa3;
            font-size: 12px;
        }

        .grid-cell.project-name {
            font-weight: 500;
            color: #112331;
        }

        .grid-cell.responsible {
            color: var(--text-muted);
        }

        .timeline-container {
            grid-column: span 4;
            background-color: #ffffff;
            border-bottom: 1px solid #e9edf2;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .timeline-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            pointer-events: none;
        }

        .bg-q-column {
            border-right: 1px solid #f0f4f8;
            height: 100%;
        }

        .bg-q-column:last-child {
            border-right: none;
        }

        .timeline-bar-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-bar {
            position: absolute;
            height: 20px;
            background-color: var(--bar-color);
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            z-index: 2;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05);
        }

        .timeline-bar:hover {
            background-color: var(--bar-hover);
            transform: scaleY(1.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="top-navbar">
            <h1>Portafolio de Proyectos 2027</h1>
            <div class="nav-buttons">
                <button class="btn-tablero">Tablero</button>
                <button class="btn-roadmap">Resumen semanal</button>
            </div>
        </div>

        <div class="roadmap-grid" id="roadmapGrid">
            <!-- Encabezados -->
            <div class="grid-header">Clasificación</div>
            <div class="grid-header">Proyecto</div>
            <div class="grid-header">Responsable</div>
            <div class="grid-header q-header">Q1</div>
            <div class="grid-header q-header">Q2</div>
            <div class="grid-header q-header">Q3</div>
            <div class="grid-header q-header">Q4</div>
        </div>
    </div>

    <script>
        // Set de datos estructurado del XLS
        const datosXLS = [
            { sub: "Banca Minorista", proy: "Aplicación de inversiones MVP 2", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Rediseño Proceso de Originación MVP 2 ", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Copiloto MVP 2", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Créditos Asociados a Nómina (CAN)", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Cash Loans", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Personalización de ofertas", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Plataforma Banca Empresarial (Fase 1) - PyME Empresa Mediana y Grupos Corporativos", resp: "R.Galindo, R. Vázquez, B.Flores", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Banca Electrónica Móvil", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Dispersión de Nóminas", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Hub de pagos", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Liquidez (Cash Management)", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Créditos para Empresas", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Otros", resp: "", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Mayorista", proy: "Banco recaudador", resp: "R. Vázquez", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Transversales", proy: "Modelos de riesgo, KYC y monitoreo", resp: "C. Carreón", inicio: "", fin: "" },
            { sub: "Transversales", proy: "Data Analystics", resp: "M. Matus", inicio: "", fin: "" },
            { sub: "Banca Minorista", proy: "Aplicación de inversiones MVP 1", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Rediseño Proceso de Originación MVP 1 ", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Banca Minorista", proy: "Copiloto MVP 1", resp: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Transversales", proy: "Implementación de TEF", resp: "A. Nava", inicio: "", fin: "" },
            { sub: "Transversales", proy: "Tokenización", resp: "A. Nava", inicio: "", fin: "" },
            { sub: "Nuevos proyectos", proy: "CRM Objetivo", resp: "M. Matus", inicio: "2027-01-01", fin: "2027-12-31" },
            { sub: "Nuevos proyectos", proy: "Content Manager Objetivo (Filenet)", resp: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" },
            { sub: "Nuevos proyectos", proy: "Upgrade S4 HANNA (E R P)", resp: "C. Budar", inicio: "", fin: "" },
            { sub: "Nuevos proyectos", proy: "Herramientas IA", resp: "M. Matus", inicio: "", fin: "" },
            { sub: "Nuevos proyectos", proy: "Implementación Middleware (Greenfield)", resp: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" },
            { sub: "Nuevos proyectos", proy: "Nuevo Core Bancario & Bca Empresarial", resp: "M. Matus", inicio: "", fin: "" },
            { sub: "Carryover 2026", proy: "Robustecimiento BKAYA 2026", resp: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" },
            { sub: "Carryover 2026", proy: "PCI DSS", resp: "C. Carreón", inicio: "", fin: "" },
            { sub: "Carryover 2026", proy: "Controles de Integridad de Software Core Bancario", resp: "C. Carreón", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "2FA en transacciones con TDD no presenciales", resp: "C. Carreón", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Robustecimiento de controles de seguridad", resp: "C. Carreón", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "FATCA / CRS", resp: "C. Budar", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Identificador Cliente Derechos ARCO", resp: "C. Carreón", inicio: "", fin: "" },
{ sub: "Nuevos proyectos", proy: "Reportes Regulatorios", resp: "C. Budar", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Migración Campo c63 al c57", resp: "A. Nava", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Automatización proceso trxs POS", resp: "A. Nava", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Automatización de procesos (3 sows)", resp: "A. Nava", inicio: "", fin: "" },
{ sub: "Carryover 2026", proy: "Reingeniería IVR", resp: "A. Nava", inicio: "", fin: "" },
{ sub: "Nuevos proyectos", proy: "Nueva Plataforma PLD", resp: "C. Carreón", inicio: "", fin: "" }
];
const container = document.getElementById('roadmapGrid');
const startYear = new Date('2027-01-01').getTime();
const endYear = new Date('2027-12-31').getTime();
const totalYearTime = endYear - startYear;
datosXLS.forEach(item => {
// Regla de negocio: Omitir si no tiene fecha de inicio o fin
if (!item.inicio || !item.fin) return;
const projectStart = new Date(item.inicio).getTime();
const projectEnd = new Date(item.fin).getTime();
const leftPercent = ((projectStart - startYear) / totalYearTime) * 100;
const widthPercent = ((projectEnd - projectStart) / totalYearTime) * 100;
// Celda Clasificación
const cellSub = document.createElement('div');
cellSub.className = 'grid-cell classification';
cellSub.textContent = item.sub;
container.appendChild(cellSub);
// Celda Proyecto
const cellProy = document.createElement('div');
cellProy.className = 'grid-cell project-name';
cellProy.textContent = item.proy;
container.appendChild(cellProy);
// Celda Responsable
const cellResp = document.createElement('div');
cellResp.className = 'grid-cell responsible';
cellResp.textContent = item.resp || 'Sin asignar';
container.appendChild(cellResp);
// Celda Roadmap (4 Qs)
const timelineContainer = document.createElement('div');
timelineContainer.className = 'timeline-container';
const bgGrid = document.createElement('div');
bgGrid.className = 'timeline-bg-grid';
bgGrid.innerHTML = ''.repeat(4);
timelineContainer.appendChild(bgGrid);
const barWrapper = document.createElement('div');
barWrapper.className = 'timeline-bar-wrapper';
const bar = document.createElement('div');
bar.className = 'timeline-bar';
bar.style.left = leftPercent + '%';
bar.style.width = widthPercent + '%';
bar.title = ${item.proy} (${item.inicio} / ${item.fin});
barWrapper.appendChild(bar);
timelineContainer.appendChild(barWrapper);
container.appendChild(timelineContainer);
});
